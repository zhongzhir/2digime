# Digital Me V2 packaged build (electron-builder)
# Output directory is overridden by scripts/build-packaged.cjs per buildId.
#
# Windows delivery:
# - Primary: NSIS per-user installer (setup.exe)
# - Secondary: ZIP portable (win-unpacked zip)
# electron-builder "portable" target remains paused (unsigned self-extract AV surface).

appId: local.digitalme.v2
productName: 兔机米
copyright: 兔机米
directories:
  output: release-staging/_default
  buildResources: electron/build-resources
files:
  - dist/**/*
  - electron/**/*
  - package.json
  - build-meta.json
  - "!**/*.map"
  - "!scripts/**"
  - "!**/_mvp-*-evidence/**"
  - "!**/.runtime-model-credential.json"
  - "!**/secrets*.json"
asar: true
asarUnpack: []
extraFiles:
  - from: trial/试用说明.txt
    to: 试用说明.txt
extraMetadata:
  main: electron/main.cjs
win:
  # Avoid winCodeSign (symlink privilege failures on typical Windows).
  # Icon / ProductName are applied in scripts/after-pack-win-icon.cjs via rcedit.
  signAndEditExecutable: false
  icon: electron/build-resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
  # ZIP / generic win artifact (no -setup). NSIS overrides below.
  artifactName: ${productName}-${version}-public-alpha-win-x64.${ext}
afterPack: scripts/after-pack-win-icon.cjs
nsis:
  oneClick: true
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: 兔机米
  uninstallDisplayName: 兔机米
  deleteAppDataOnUninstall: false
  installerIcon: electron/build-resources/icon.ico
  uninstallerIcon: electron/build-resources/icon.ico
  installerHeaderIcon: electron/build-resources/icon.ico
  include: installer.nsh
  artifactName: ${productName}-${version}-public-alpha-win-x64-setup.${ext}
mac:
  artifactName: ${productName}-${version}-mac-${arch}.zip
  target:
    - target: zip
      arch:
        - x64
  category: public.app-category.productivity
  identity: null
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: electron/build-resources/entitlements.mac.plist
  entitlementsInherit: electron/build-resources/entitlements.mac.plist
  extendInfo:
    CFBundleName: 兔机米
    CFBundleDisplayName: 兔机米
# Do not add NSRemindersUsageDescription / calendar entitlements.
# Reminders TCC is triggered by EventKit usage or those Info.plist keys.
