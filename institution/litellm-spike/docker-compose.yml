# Isolated LiteLLM + Postgres spike for INSTITUTION-DISTRIBUTION-V01 Slice A.
# Does not attach to 2digime Core / Relay / Electron.
#
# Required host env (never commit):
#   DEEPSEEK_API_KEY
# Optional:
#   LITELLM_MASTER_KEY (default local-only placeholder for demo)
#   LITELLM_SALT_KEY

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm
      POSTGRES_DB: litellm
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - litellm_spike_pg:/var/lib/postgresql/data
    ports:
      - "54329:5432"

  litellm:
    image: docker.litellm.ai/berriai/litellm-database:main-stable
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://litellm:litellm@db:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-institution-spike-local-only}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:-sk-institution-spike-salt-change-me}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      STORE_MODEL_IN_DB: "False"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]

volumes:
  litellm_spike_pg:
