# Digital Me V2 packaged build (electron-builder)
# Output directory is overridden by scripts/build-packaged.cjs per buildId.
#
# SECURITY/FP NOTE (2026-08-03):
# electron-builder "portable" is an unsigned NSIS self-extract wrapper and is a
# known heuristic AV false-positive surface (e.g. 360 HEUR/QVM*). Portable is
# paused as the Owner delivery format. Prefer win-unpacked ZIP.

appId: local.digitalme.v2
productName: DigitalMeV2
copyright: Digital Me
directories:
  output: release-staging/_default
  buildResources: electron/build-resources
files:
  - dist/**/*
  - electron/**/*
  - package.json
  - build-meta.json
  - "!**/*.map"
  - "!scripts/**"
  - "!**/_mvp-*-evidence/**"
  - "!**/.runtime-model-credential.json"
  - "!**/secrets*.json"
asar: true
asarUnpack: []
extraMetadata:
  main: electron/main.cjs
win:
  signAndEditExecutable: false
  target:
    - target: zip
      arch:
        - x64
  artifactName: ${productName}-${version}-win-x64.zip
# portable target intentionally omitted (paused for Owner delivery).
