<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Digital Me</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <section id="view-welcome" class="view">
        <header class="hero">
          <p class="brand">Digital Me</p>
          <h1>从你的主体资料开始</h1>
          <p class="lead">创建或打开本地主体包，然后描述任务并附上材料。</p>
        </header>
        <div class="welcome-actions">
          <label class="field">
            <span>主体名称</span>
            <input id="pkg-name" type="text" placeholder="例如：个人工作主体" />
          </label>
          <div class="row">
            <button type="button" id="btn-create-pkg" class="primary">创建主体包</button>
            <button type="button" id="btn-open-pkg">打开已有主体包</button>
            <button type="button" id="btn-open-settings-welcome" class="ghost">设置</button>
          </div>
          <p id="welcome-model-status" class="status"></p>
          <p id="welcome-status" class="status" hidden></p>
        </div>
      </section>

      <section id="view-settings" class="view" hidden>
        <header class="topbar">
          <div>
            <p class="brand-sm">Digital Me</p>
            <h1>设置</h1>
          </div>
          <button type="button" id="btn-settings-back">返回</button>
        </header>
        <div class="welcome-actions settings-panel">
          <h2>模型连接</h2>
          <p class="muted">
            连接真实模型后才能开始处理任务。密钥仅保存在本机安全存储中，界面不会回显明文。
          </p>
          <label class="field">
            <span>服务提供方</span>
            <select id="model-provider">
              <option value="deepseek">DeepSeek</option>
              <option value="openai-compatible">OpenAI-compatible</option>
            </select>
          </label>
          <label class="field">
            <span>Base URL</span>
            <input id="model-base-url" type="text" placeholder="https://api.example.com/v1" autocomplete="off" />
          </label>
          <label class="field">
            <span>Model ID</span>
            <input id="model-id" type="text" placeholder="例如 deepseek-v4-flash" autocomplete="off" />
          </label>
          <label class="field">
            <span>API Key</span>
            <input
              id="model-api-key"
              type="password"
              placeholder="仅在保存时写入，不会回显"
              autocomplete="new-password"
            />
            <span id="model-key-state" class="meta">凭证状态：未配置</span>
          </label>
          <div class="row">
            <button type="button" id="btn-save-model" class="primary">保存</button>
            <button type="button" id="btn-test-model">测试连接</button>
            <button type="button" id="btn-delete-model" class="ghost">删除凭证</button>
          </div>
          <p id="settings-status" class="status" aria-live="polite"></p>
        </div>
      </section>

      <section id="view-workspace" class="view" hidden>
        <header class="topbar">
          <div>
            <p class="brand-sm">Digital Me</p>
            <h1 id="pkg-title">主体</h1>
          </div>
          <div class="topbar-actions">
            <p id="model-status" class="meta"></p>
            <button type="button" id="btn-open-settings" class="ghost">设置</button>
          </div>
        </header>

        <div class="layout">
          <aside class="panel">
            <h2>任务</h2>
            <ul id="task-list" class="task-list"></ul>
            <p id="task-empty" class="muted">还没有任务。</p>
          </aside>

          <main class="panel grow">
            <h2>新任务</h2>
            <div id="model-gate" class="model-gate" hidden>
              <p>请先连接模型，才能开始处理任务。</p>
              <button type="button" id="btn-goto-settings" class="primary">前往设置</button>
            </div>
            <label class="field">
              <span>描述你要完成的工作</span>
              <textarea
                id="goal"
                rows="5"
                placeholder="例如：根据材料写一份项目进展简报。"
              ></textarea>
            </label>
            <label class="field">
              <span>成果类型</span>
              <select id="artifact-type">
                <option value="document" selected>文档</option>
                <option value="code-analysis">代码项目分析</option>
              </select>
            </label>
            <div class="materials">
              <div class="row">
                <button type="button" id="btn-add-files">添加文件</button>
                <button type="button" id="btn-add-folder">添加文件夹</button>
                <button type="button" id="btn-clear-materials" class="ghost">清空材料</button>
              </div>
              <ul id="material-list" class="material-list"></ul>
            </div>
            <div class="row">
              <button type="button" id="btn-submit" class="primary">开始处理</button>
              <button type="button" id="btn-cancel" disabled>取消</button>
              <button type="button" id="btn-retry" disabled>重试</button>
            </div>
            <p id="job-status" class="status" aria-live="polite"></p>
            <p id="job-actionable" class="muted"></p>

            <section id="experience-panel" class="experience" hidden>
              <h2>可复用经验</h2>
              <p class="muted">来自你最近对成果的修改，确认后会在类似任务中参考。</p>
              <ul id="experience-list"></ul>
            </section>

            <section id="artifact-panel" class="artifact" hidden>
              <div class="artifact-head">
                <h2>成果</h2>
                <div class="row">
                  <button type="button" id="btn-copy">复制</button>
                  <button type="button" id="btn-export-md">导出 Markdown</button>
                  <button type="button" id="btn-export-docx">导出 Word</button>
                  <button type="button" id="btn-reveal">打开所在目录</button>
                </div>
              </div>
              <p id="save-status" class="meta"></p>
              <p id="version-meta" class="meta"></p>
              <div id="bundle-view" class="bundle-view" hidden>
                <pre id="bundle-report" class="bundle-report"></pre>
                <div id="bundle-manifest" class="bundle-manifest muted"></div>
                <ul id="bundle-entries" class="bundle-entries"></ul>
              </div>
              <textarea id="artifact-editor" rows="18" spellcheck="true"></textarea>
              <div class="revise-box">
                <label class="field">
                  <span>继续修改</span>
                  <textarea
                    id="revision-request"
                    rows="3"
                    placeholder="说明你希望如何改这篇成果。例如：开篇改成获奖事实，语气更像新闻报道。"
                  ></textarea>
                </label>
                <div class="row">
                  <button type="button" id="btn-revise" class="primary">修改成果</button>
                </div>
              </div>
            </section>
          </main>
        </div>
      </section>
    </div>
    <script src="app.js"></script>
  </body>
</html>
