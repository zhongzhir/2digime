<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Digital Me</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <section id="view-welcome" class="view">
        <header class="hero">
          <p class="brand">Digital Me</p>
          <h1>从你的主体资料开始</h1>
          <p class="lead">创建或打开本地主体包，然后描述任务并附上材料。</p>
        </header>
        <div class="welcome-actions">
          <label class="field">
            <span>主体名称</span>
            <input id="pkg-name" type="text" placeholder="例如：个人工作主体" />
          </label>
          <div class="row">
            <button type="button" id="btn-create-pkg" class="primary">创建主体包</button>
            <button type="button" id="btn-open-pkg">打开已有主体包</button>
          </div>
          <p id="welcome-status" class="status" hidden></p>
        </div>
      </section>

      <section id="view-workspace" class="view" hidden>
        <header class="topbar">
          <div>
            <p class="brand-sm">Digital Me</p>
            <h1 id="pkg-title">主体</h1>
          </div>
          <p id="model-status" class="meta"></p>
        </header>

        <div class="layout">
          <aside class="panel">
            <h2>任务</h2>
            <ul id="task-list" class="task-list"></ul>
            <p id="task-empty" class="muted">还没有任务。</p>
          </aside>

          <main class="panel grow">
            <h2>新建任务</h2>
            <label class="field">
              <span>你想完成什么</span>
              <textarea
                id="goal"
                rows="5"
                placeholder="用一两段话说明目标。例如：根据材料写一份项目进展简报。"
              ></textarea>
            </label>
            <div class="materials">
              <div class="row">
                <button type="button" id="btn-add-files">添加文件</button>
                <button type="button" id="btn-add-folder">添加文件夹</button>
                <button type="button" id="btn-clear-materials" class="ghost">清空材料</button>
              </div>
              <ul id="material-list" class="material-list"></ul>
            </div>
            <div class="row">
              <button type="button" id="btn-submit" class="primary">开始处理</button>
              <button type="button" id="btn-cancel" disabled>取消</button>
              <button type="button" id="btn-retry" disabled>重试</button>
            </div>
            <p id="job-status" class="status" aria-live="polite"></p>
            <p id="job-actionable" class="muted"></p>

            <section id="experience-panel" class="experience" hidden>
              <h2>可复用经验</h2>
              <p class="muted">来自你最近对成果的修改，确认后会在类似任务中参考。</p>
              <ul id="experience-list"></ul>
            </section>

            <section id="artifact-panel" class="artifact" hidden>
              <div class="artifact-head">
                <h2>成果</h2>
                <div class="row">
                  <button type="button" id="btn-copy">复制</button>
                  <button type="button" id="btn-export-md">导出 Markdown</button>
                  <button type="button" id="btn-export-docx">导出 Word</button>
                  <button type="button" id="btn-reveal">打开所在目录</button>
                </div>
              </div>
              <p id="save-status" class="meta"></p>
              <textarea id="artifact-editor" rows="18" spellcheck="true"></textarea>
            </section>
          </main>
        </div>
      </section>
    </div>
    <script src="app.js"></script>
  </body>
</html>
