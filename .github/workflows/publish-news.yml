name: Publish news from trusted agent

on:
  repository_dispatch:
    types: [publish_news]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: news-publish
  cancel-in-progress: false

jobs:
  validate-build-publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate dispatch and create content record
        run: node scripts/news/ingest-dispatch.mjs
      - name: Build and verify website
        run: |
          node scripts/news/build-news.mjs
          node site/check-site.mjs
      - name: Commit accepted article
        run: |
          git config user.name "2digime-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/news site
          if git diff --cached --quiet; then
            echo "No new content to commit"
          else
            git commit -m "content(news): publish ${{ github.event.client_payload.id }}"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  deploy-production:
    if: ${{ vars.PRODUCTION_DEPLOY_ENABLED == 'true' }}
    needs: validate-build-publish
    uses: ./.github/workflows/deploy-production.yml
    secrets: inherit
